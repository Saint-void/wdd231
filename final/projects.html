  <link rel="icon" href="favicon.svg">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/footer.css">

</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">Final Project</a>
      <button id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="Toggle dark theme">🌙 <span class="sr-only">Toggle dark theme</span></button>
      <button id="navToggle" class="nav-toggle" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="hamburger" aria-hidden="true">
          <span class="bar bar1"></span>
          <span class="bar bar2"></span>
          <span class="bar bar3"></span>
        </span>
        <span class="sr-only">Menu</span>
      </button>
      <nav id="main-nav" class="nav" role="navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html" aria-current="page">Projects</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Projects</h1>
    <section>
      <h2>Project Collection</h2>
      <p class="lead">Items below are loaded from a local JSON file via an ES module.</p>
      <div id="items" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <!-- Accessible modal -->
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close dialog">×</button>
      <h3 id="modalTitle"></h3>
      <img id="modalImage" alt="" />
      <p id="modalDescription"></p>
      <p><strong>Category:</strong> <span id="modalCategory"></span></p>
      <p><strong>Date:</strong> <span id="modalDate"></span></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Final Project</p>
    </div>
  </footer>

  <script src="scripts/nav.js" defer></script>
